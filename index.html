<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For My Princess Accountant ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- =====================================
         WELCOME SCREEN ❤️
    ====================================== -->

    <section class="welcome">

        <div class="welcome-content">

            <div class="heart">
                ❤️
            </div>

            <p class="small-text">
                A LITTLE SOMETHING FOR
            </p>

            <h1>
                PRINCESS ACCOUNTANT
            </h1>

            <p class="message">
                Some memories deserve more than
                a place in my phone.

                <br><br>

                So I made this little place for ours.
            </p>

            <button id="openButton">
                Open Our Memories ❤️
            </button>

        </div>

    </section>



    <!-- =====================================
         PHOTO SLIDESHOW 📸
    ====================================== -->

    <section
        class="memories"
        id="memories"
    >

        <div class="photo-container">

            <img
                id="memoryPhoto"
                src="photos/photo1.jpg"
                alt="Our Memory"
            >

            <div class="photo-overlay"></div>

            <div class="photo-message">

                <p>
                    And then there was you... ❤️
                </p>

            </div>

        </div>

    </section>



    <!-- =====================================
         OUR VIDEO 🎥
    ====================================== -->

    <section
        class="video-memory"
        id="videoMemory"
    >

        <video
            id="ourVideo"
            playsinline
            preload="auto"
        >

            <source
                src="video/ourvideo.mp4"
                type="video/mp4"
            >

            Your browser does not support the video.

        </video>


        <div class="video-caption">

            <p>
                Some memories deserve to be replayed ❤️
            </p>

        </div>

    </section>



    <!-- =====================================
         BACKGROUND MUSIC 🎵
    ====================================== -->

    <audio
        id="backgroundMusic"
        preload="auto"
    >

        <source
            src="photograph.mp3"
            type="audio/mpeg"
        >

    </audio>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
